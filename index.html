/* ---------- pop-up-uri zilnice ---------- */
function pRow(p,right){return `<div class="li"><div style="min-width:0"><div class="n">${esc(p.nume)}${p.kind==="s"?" · comun":""}</div><div class="s">${esc(p.sarcina||p.livrabil||"")}${(p.sarcina||p.livrabil)&&p.termen?" · ":""}${p.termen?"termen "+fmt(p.termen):""}</div></div>${right||""}</div>`}
const popSec=(t,html)=>html?`<div class="hint" style="text-transform:uppercase;letter-spacing:.06em;font-weight:600;margin-top:4px">${t}</div>${html}`:"";
function popSwitch(cur){return `<div class="row" style="justify-content:flex-end">${cur==="pm"?`<button type="button" class="btn sm" data-act="gosapt">Trec orele în Săptămâna</button>`:""}<button class="btn primary" data-act="close">Am înțeles</button></div>`}
function morningPopup(){
  const hot=active().filter(p=>["crit","urg"].includes(urg(p).lvl)).sort(byUrg);
  const today=active().filter(p=>(p.zile||[]).includes(TODAY)&&!hot.includes(p)).sort(byUrg);
  const wk=active().filter(p=>urg(p).lvl==="week"&&!today.includes(p)).sort(byUrg);
  const list=a=>a.length?`<div class="list">${a.join("")}</div>`:"";
  const body=popSec("Urgente · "+hot.length,list(hot.map(p=>pRow(p,`<span class="chip crit">${esc(urg(p).label)}</span>`))))
    +popSec("În lucru azi · "+today.length,list(today.map(p=>pRow(p))))
    +popSec("Termene săptămâna asta",list(wk.map(p=>pRow(p,`<span class="chip warn">${fmt(p.termen)}</span>`))));
  openModal("Bună dimineața, "+(meP().nume||"")+" — planul zilei",`<div class="mb"><div class="hint">${fmtLong(TODAY)}</div>${body||`<div class="empty">Nimic planificat și nimic urgent azi. Bifează zilele de lucru la proiecte ca să apară aici.</div>`}${popSwitch("am")}</div>`);
}
function eveningPopup(){
  const tom=iso(addDays(parse(TODAY),1));
  const logs=S.logs.filter(l=>l.data===TODAY);const tot=logs.reduce((a,l)=>a+(+l.ore||0),0);
  const byP={};logs.forEach(l=>{byP[l.projectId]=(byP[l.projectId]||0)+(+l.ore||0)});
  const missing=active().filter(p=>(p.zile||[]).includes(TODAY)&&!byP[p.id]).sort(byUrg);
  const soon=active().filter(p=>p.termen&&p.termen<=iso(addDays(parse(TODAY),2))).sort(byUrg);
  const list=a=>a.length?`<div class="list">${a.join("")}</div>`:"";
  const body=`<div class="sumrow" style="grid-template-columns:repeat(2,minmax(0,1fr))"><div class="stat"><div class="k">Ore lucrate azi</div><div class="v num">${h(tot)} <small>h</small></div></div><div class="stat"><div class="k">Proiecte lucrate</div><div class="v num">${Object.keys(byP).length}</div></div></div>`
    +popSec("Orele de azi",list(Object.entries(byP).map(([id,o])=>`<div class="li"><div class="n" style="min-width:0">${esc(pname(id))}</div><span class="num">${h(o)} h</span></div>`)))
    +popSec("Planificate azi, fără ore trecute · "+missing.length,list(missing.map(p=>pRow(p))))
    +popSec("Termen până poimâine",list(soon.map(p=>pRow(p,`<span class="chip ${p.termen<=tom?"crit":"warn"}">${p.termen<TODAY?"depășit":p.termen===TODAY?"azi":p.termen===tom?"mâine":fmt(p.termen)}</span>`))));
  openModal("Încheierea zilei",`<div class="mb"><div class="hint">${fmtLong(TODAY)} · ${EVENING}</div>${body}${!tot?`<div class="hint">N-ai trecut încă nicio oră azi.</div>`:""}${TODAY===lastWorkdayOfMonth(parse(TODAY))?`<div class="alert warn" style="align-items:center"><div class="grow"><b>Ultima zi lucrătoare a lunii</b><div>Raportul lunii ${ymLabel(TODAY.slice(0,7))} e gata de descărcat.</div></div><button type="button" class="btn sm primary" data-act="raport">Descarcă raportul</button></div>`:""}${popSwitch("pm")}</div>`);
}
function urgentPopup(){
  const hot=active().filter(p=>["crit","urg"].includes(urg(p).lvl)).sort(byUrg);
  if(!hot.length)return morningPopup();
  openModal("Atenție: termene urgente",`<div class="mb"><div class="list">${hot.map(p=>pRow(p,`<span class="chip crit">${esc(urg(p).label)}</span>`)).join("")}</div><div class="btns"><div class="r"><button class="btn primary" data-act="close">Am înțeles</button></div></div></div>`);
}
const EVENING="16:50";
const nowHM=()=>{const d=new Date();return pad(d.getHours())+":"+pad(d.getMinutes())};
function maybePopup(){
  if(!S.me||!allLoaded()||document.querySelector(".ov"))return;
  const k=x=>"pp-"+x+"-"+S.me;
  if(nowHM()>=EVENING){if(lsGet(k("pm"))!==TODAY){lsSet(k("pm"),TODAY);lsSet(k("am"),TODAY);eveningPopup()}return}
  if(lsGet(k("am"))!==TODAY){lsSet(k("am"),TODAY);morningPopup()}
}
setInterval(maybePopup,20000);

/* ---------- acțiuni ---------- */
document.addEventListener("click",async e=>{
  if(e.target.closest("#gate"))return;
  const b=e.target.closest("[data-act],[data-tab]");if(!b)return;
  if(b.dataset.tab){S.tab=b.dataset.tab;try{localStorage.setItem("pp-tab",S.tab)}catch(_){}renderView();return}
  const a=b.dataset.act;
  if(a==="close"){closeModal();return}
  if(a==="logout"){logout();return}
  if(!S.me)return;
  const id=b.dataset.id,p=S.projects.find(x=>x.id===id);
  const sh=p&&p.kind==="s";
  if(a==="popup")urgentPopup();
  else if(a==="am")morningPopup();
  else if(a==="gosapt"){closeModal();S.tab="sapt";S.weekStart=monday(parse(TODAY));renderView()}
  else if(a==="pm")eveningPopup();
  else if(a==="day")(nowHM()>=EVENING?eveningPopup:morningPopup)();
  else if(a==="profile")profileModal();
  else if(a==="bk-exp")exportBackup();
  else if(a==="bk-imp"){closeModal();importBackupModal()}
  else if(a==="edit"&&p)projectModal(p);
  else if(a==="share"&&p)projectModal(p,true);
  else if(a==="log")logModal(id);
  else if(a==="done"&&p)finishModal(p);
  else if(a==="etapa"&&p)etapaModal(p);
  else if(a==="resume"&&p)write(()=>projRef(p.id).update({status:"activ",opritLa:""}),"„"+p.nume+"” reluat");
  else if(a==="reopen"&&p)write(async()=>{if(p.projStatus==="finalizat")await projRef(p.id).update({status:"activ",finalizatLa:""});
      if(sh)await savePlan(p.id,{stare:"activ",finalizatLa:""})},"Redeschis");
  else if(a==="dellog")write(()=>hourRef(id).delete(),"Înregistrare ștearsă").then(ok=>{if(ok&&b.closest(".modal"))closeModal()});
  else if(a==="editlog"){const l=S.logs.find(x=>x.id===id);if(l)editLogModal(l)}
  else if(a==="hours"&&p)hoursModal(p.id);
  else if(a==="dellog2"){const pid=b.dataset.p,day=b.dataset.day;write(()=>hourRef(id).delete(),"Înregistrare ștearsă").then(ok=>{if(ok)setTimeout(()=>hoursModal(pid,day||undefined),150)})}
  else if(a==="logfor")logModal(id,b.dataset.d||undefined,!!b.dataset.d);
  else if(a==="wprev"){S.weekStart=addDays(S.weekStart,-7);renderView()}
  else if(a==="wnext"){S.weekStart=addDays(S.weekStart,7);renderView()}
  else if(a==="raport"){closeModal();reportModal()}
  else if(a==="kper"){S.kpiPer=b.dataset.p;S.kpiShift=0;renderView()}
  else if(a==="kprev"){S.kpiShift=(S.kpiShift||0)+1;renderView()}
  else if(a==="knext"){S.kpiShift=Math.max(0,(S.kpiShift||0)-1);renderView()}
  else if(a==="kcur"){S.kpiShift=0;renderView()}
  else if(a==="sper"){S.sintPer=b.dataset.p;renderView()}
  else if(a==="mprev"){S.sintMonth=ymShift(S.sintMonth||curYM(),-1);renderView()}
  else if(a==="mnext"){S.sintMonth=ymShift(S.sintMonth||curYM(),1);renderView()}
  else if(a==="mtoday"){S.sintMonth=curYM();renderView()}
  else if(a==="raportM"){downloadMonth(S.sintMonth||curYM())}
  else if(a==="wtoday"){S.weekStart=monday(parse(TODAY));renderView()}
  else if(a==="copysint"){const txt=synthText();
    try{await navigator.clipboard.writeText(txt);toast("Sinteza a fost copiată")}
    catch(_){openModal("Sinteza săptămânii",`<div class="mb"><label class="f">Selectează și copiază (Ctrl+C)<textarea id="sint-txt" style="min-height:260px;font-family:var(--f-mono);font-size:13px" readonly>${esc(txt)}</textarea></label></div>`,r=>{const t=r.querySelector("#sint-txt");t.focus();t.select()})}}
  else if(a==="cell"&&p)projectModal(p,false,b.dataset.d);
  else if(a==="avize"&&p)projectModal(p,false,null,"av");
  else if(a==="avmode"){S.avMode=b.dataset.p;renderView()}
  else if(a==="adcell"){adminModal(b.dataset.d)}
  else if(a==="gotoday"){S.tab="sapt";S.weekStart=monday(parse(b.dataset.d));renderView();window.scrollTo(0,0)}
  else if(a==="cotoggle"){const d=b.dataset.d,id=S.me+"__"+CO+"__"+d;
    if(leaveDay(d)){for(const l of S.leave.filter(l=>!isL(l)&&l.data===d))await write(()=>hourRef(l.id).delete(),"Concediul din "+fmt(d)+" a fost scos")}
    else if(dayHrs&&S.logs.some(l=>!isL(l)&&l.data===d&&(+l.ore||0)>0))toast("În "+fmt(d)+" ai ore pontate pe proiecte. Șterge-le întâi din Editează, apoi treci concediul.");
    else await write(()=>hourRef(id).set({projectId:CO,personId:S.me,data:d,ore:MAX_ZI,nota:"Concediu odihnă",creatLa:new Date().toISOString()}),"Concediu trecut în "+fmt(d))}
  else if(a==="timer-start"&&p){
    if(S.timer&&S.timer.projectId){toast("Oprește întâi cronometrul pornit pe „"+pname(S.timer.projectId)+"”.");return}
    write(()=>timerRef().set({projectId:id,start:Date.now()}),"Cronometru pornit");
  }
  else if(a==="timer-stop"&&S.timer){
    const t=S.timer;const hrs=Math.max(0.25,Math.round((Date.now()-t.start)/36e5*4)/4);
    const d=iso(new Date(t.start));
    await write(async()=>{await addHours(t.projectId,d,hrs,"cronometru");await timerRef().set({projectId:"",start:0})},h(hrs)+" h salvate pe „"+pname(t.projectId)+"”");
  }
  else if(a==="timer-cancel")write(()=>timerRef().set({projectId:"",start:0}),"Cronometru anulat");
});
document.getElementById("b-new").addEventListener("click",()=>{if(S.me)projectModal()});
/* „+ Livrabil nou” din bara de sus (23.10.2026): aleg proiectul, apoi în paralel / după lucrarea curentă */
document.getElementById("b-newliv").addEventListener("click",()=>{if(!S.me)return;
  const byN=(a,b)=>String(a.nume).localeCompare(String(b.nume),"ro");
  const R=S.projects.filter(p=>!p.parentId||!S.proj.some(x=>x.id===p.parentId));
  const open=R.filter(p=>!projClosed(p.id)).sort(byN),closed=R.filter(p=>projClosed(p.id)).sort(byN);
  if(!R.length){toast("Adaugă întâi un proiect cu „+ Proiect”.");return}
  const lucr=p=>[p,...S.projects.filter(x=>x.parentId===p.id)];
  const o=p=>`<optgroup label="${esc(p.nume)}${p.cod?" · "+esc(p.cod):""}">${lucr(p).map(x=>`<option value="${esc(x.id)}">${esc(p.nume)} — ${esc(x.parentId?"livrabil paralel: ":"lucrarea: ")}${esc([x.faza,x.livrabil].filter(Boolean).join(" · ")||"—")}${x.status==="finalizat"?" (predată)":""}</option>`).join("")}</optgroup>`;
  openModal("Livrabil nou",`<form id="nlf"><label class="f">Proiectul și lucrarea de la care pornești<select id="nl-p">${open.map(o).join("")}${closed.length?closed.map(o).join("").replace(/<optgroup label="/g,'<optgroup label="(încheiat) '):""}</select></label>
    <div class="hint">La pasul următor alegi dacă livrabilul nou merge în paralel cu lucrarea aleasă sau după ea.</div>
    <div class="btns"><div class="r"><button type="button" class="btn ghost" data-act="close">Renunță</button><button class="btn primary" type="submit">Continui</button></div></div></form>`,r=>{
    r.querySelector("#nlf").addEventListener("submit",e=>{e.preventDefault();const p=S.projects.find(x=>x.id===r.querySelector("#nl-p").value);if(p){closeModal();newLivModal(p)}})});
});
/* lista „Alte proiecte” din Azi rămâne deschisă / închisă la reîmprospătarea datelor */
document.addEventListener("toggle",e=>{if(e.target.classList&&e.target.classList.contains("azi-more"))S.aziMore=e.target.open},true);

/* ---------- pornire ---------- */
const err=e=>{console.error(e);toast("Probleme de conexiune cu baza de date.")};
renderAll();
(async()=>{
  const db=window.claude&&window.claude.use?await window.claude.use("db"):null;
  const user=window.claude&&window.claude.use?await window.claude.use("user"):null;
  const uid=user?await user.id():null;
  if(!db||!uid){S.db=false;S.loaded={pe:true,pr:true,pl:true,h:true};renderAll();return}
  S.db=db;S.base=db.doc("data/users/"+uid+"/planner");
  const remembered=lsGet("pp-me");
  col("persons").onSnapshot(s=>{S.persons=s.docs.map(d=>Object.assign({id:d.id},d.data()));S.loaded.pe=true;
    if(!S.me&&remembered&&S.persons.some(p=>p.id===remembered&&p.pwHash)){S.me=remembered;subscribeTimer()}
    if(S.me&&!S.persons.some(p=>p.id===S.me))logout();
    rebuild();maybePopup()},err);
  col("settings").onSnapshot(s=>{const d=s.docs.find(x=>x.id==="faze");S.fazeCustom=d?(d.data().list||[]):[]},err);
  col("proj").onSnapshot(s=>{S.proj=s.docs.map(d=>Object.assign({id:d.id},d.data()));S.loaded.pr=true;rebuild();maybePopup()},err);
  col("plan").onSnapshot(s=>{const m={};s.docs.forEach(d=>{m[d.id]=d.data()});S.plan=m;S.loaded.pl=true;rebuild()},err);
  col("hours").onSnapshot(s=>{S.hours=s.docs.map(d=>Object.assign({id:d.id},d.data()));S.loaded.h=true;rebuild();maybePopup()},err);
})();
})();

</script>
