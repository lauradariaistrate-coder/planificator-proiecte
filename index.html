<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Planificator Proiecte</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: planșă tehnică — cartuș sus, alertă, filă Azi / Săptămâna (matrice plan+ore) / Finalizate */
:root{
  --paper:#F3F5F4; --sheet:#FFFFFF; --ink:#1C2830; --ink-2:#55636C; --line:#D5DCDD; --line-2:#E6EBEB;
  --accent:#2C5F86; --accent-soft:#E2ECF3;
  --crit:#B63A2B; --crit-soft:#F7E3E0; --warn:#9A6E12; --warn-soft:#F6EDD6; --ok:#2F7150; --ok-soft:#E0EFE6;
  --plan:#2C5F86; --grid:rgba(44,95,134,.05);
  --f-disp:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"Barlow","Segoe UI",Arial,sans-serif;
  --f-mono:"IBM Plex Mono",Consolas,"Courier New",monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#141A1E; --sheet:#1B2328; --ink:#E4EAEC; --ink-2:#9AA8AF; --line:#34414A; --line-2:#29333A;
  --accent:#7FB0D6; --accent-soft:#233746;
  --crit:#EE8473; --crit-soft:#3E2420; --warn:#E0B65A; --warn-soft:#3A3020; --ok:#7CC49C; --ok-soft:#1F3529;
  --plan:#7FB0D6; --grid:rgba(127,176,214,.05); color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#141A1E; --sheet:#1B2328; --ink:#E4EAEC; --ink-2:#9AA8AF; --line:#34414A; --line-2:#29333A;
  --accent:#7FB0D6; --accent-soft:#233746;
  --crit:#EE8473; --crit-soft:#3E2420; --warn:#E0B65A; --warn-soft:#3A3020; --ok:#7CC49C; --ok-soft:#1F3529;
  --plan:#7FB0D6; --grid:rgba(127,176,214,.05); color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:24px 24px;padding:0 16px;padding-block:20px 48px}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

/* Cartuș */
.cartus{display:grid;grid-template-columns:1fr auto;border:1.5px solid var(--ink);background:var(--sheet)}
.cartus .t{padding:12px 16px;border-right:1.5px solid var(--ink);min-width:0}
.cartus h1{font-family:var(--f-disp);font-weight:700;font-size:30px;letter-spacing:.02em;text-transform:uppercase;margin:0;line-height:1.05;text-wrap:balance}
.cartus .sub{color:var(--ink-2);font-size:13px;margin-top:2px}
.cartus .meta{display:grid;grid-template-columns:repeat(2,auto);font-size:12px}
.cartus .meta div{padding:6px 12px;border-bottom:1px solid var(--line);border-left:1px solid var(--line)}
.cartus .meta div:nth-child(odd){color:var(--ink-2);text-transform:uppercase;letter-spacing:.06em;font-size:10.5px;border-left:0}
.cartus .meta div:nth-last-child(-n+2){border-bottom:0}
@media (max-width:640px){.cartus{grid-template-columns:1fr}.cartus .t{border-right:0;border-bottom:1.5px solid var(--ink)}}

/* Alertă */
.alert{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border:1.5px solid var(--crit);background:var(--crit-soft);color:var(--ink)}
.alert b{font-family:var(--f-disp);font-size:18px;letter-spacing:.03em;text-transform:uppercase;color:var(--crit)}
.alert ul{margin:4px 0 0;padding-left:18px}
.alert .grow{flex:1;min-width:0}
.alert.warn{border-color:var(--warn);background:var(--warn-soft)}
.alert.warn b{color:var(--warn)}

/* Cifre */
.stats{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));border:1px solid var(--line);background:var(--sheet)}
.stat{padding:10px 14px;border-left:1px solid var(--line);min-width:0}
.stat:first-child{border-left:0}
.stat .k{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-2)}
.stat .v{font-family:var(--f-disp);font-size:28px;font-weight:600;line-height:1.1}
.stat .v small{font-size:14px;color:var(--ink-2);font-weight:500}
@media (max-width:760px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.stat{border-left:0;border-top:1px solid var(--line)}.stat:nth-child(-n+2){border-top:0}.stat:nth-child(even){border-left:1px solid var(--line)}}

/* Bara */
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.tabs{display:flex;gap:0;border:1px solid var(--ink)}
.tab{background:var(--sheet);border:0;border-left:1px solid var(--ink);padding:8px 16px;font-family:var(--f-disp);font-size:16px;font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.tab:first-child{border-left:0}
.tab[aria-selected="true"]{background:var(--ink);color:var(--sheet)}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--ink);background:var(--sheet);padding:7px 14px;font-weight:600;font-size:14px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--sheet)}
.btn.ghost{border-color:var(--line)}
.btn.sm{padding:4px 10px;font-size:13px}
.btn.danger{border-color:var(--crit);color:var(--crit)}
.btn:disabled{opacity:.5;cursor:default}

/* Timer */
.timer{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:10px 14px;border:1.5px solid var(--accent);background:var(--accent-soft)}
.timer .clock{font-family:var(--f-mono);font-size:22px;font-weight:500}
.pulse{width:10px;height:10px;border-radius:50%;background:var(--crit);animation:p 1.4s infinite}
@keyframes p{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.pulse{animation:none}}

/* Cards Azi */
.section-h{font-family:var(--f-disp);font-size:20px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;margin:6px 0 0;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.section-h span{font-family:var(--f-body);font-size:13px;text-transform:none;letter-spacing:0;color:var(--ink-2);font-weight:400}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.card{background:var(--sheet);border:1px solid var(--line);display:flex;flex-direction:column;min-width:0;position:relative}
.card .stripe{height:4px;background:var(--line)}
.card.crit .stripe{background:var(--crit)} .card.urg .stripe{background:var(--crit)} .card.week .stripe{background:var(--warn)} .card.done .stripe{background:var(--ok)}
.card .body{padding:12px 14px;display:flex;flex-direction:column;gap:8px;flex:1}
.card h3{margin:0;font-family:var(--f-disp);font-size:21px;font-weight:600;line-height:1.15;overflow-wrap:anywhere}
.card .code{font-family:var(--f-mono);font-size:11.5px;color:var(--ink-2)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{font-size:11.5px;padding:2px 8px;border:1px solid var(--line);text-transform:uppercase;letter-spacing:.05em;font-weight:600;white-space:nowrap}
.chip.crit{border-color:var(--crit);color:var(--crit);background:var(--crit-soft)}
.chip.warn{border-color:var(--warn);color:var(--warn);background:var(--warn-soft)}
.chip.ok{border-color:var(--ok);color:var(--ok);background:var(--ok-soft)}
.chip.info{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.chip.mute{color:var(--ink-2)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;font-size:13.5px}
.kv dt{color:var(--ink-2)} .kv dd{margin:0}
.meter{height:6px;background:var(--line-2);position:relative}
.meter i{position:absolute;inset:0 auto 0 0;background:var(--accent)}
.meter.over i{background:var(--crit)}
.card .foot{display:flex;gap:6px;flex-wrap:wrap;padding:10px 14px;border-top:1px dashed var(--line)}
.note{font-size:13px;color:var(--ink-2);white-space:pre-wrap;overflow-wrap:anywhere}
.empty{border:1.5px dashed var(--line);padding:22px;text-align:center;color:var(--ink-2);background:var(--sheet)}

/* Matrice săptămână */
.weeknav{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.weeknav .lbl{font-family:var(--f-disp);font-size:20px;font-weight:600;min-width:220px}
.tablewrap{overflow-x:auto;border:1px solid var(--line);background:var(--sheet)}
table.m{border-collapse:collapse;width:100%;min-width:760px;font-size:13.5px}
table.m th,table.m td{border:1px solid var(--line-2);padding:6px 8px;text-align:center;vertical-align:middle}
table.m thead th{font-family:var(--f-disp);font-size:14px;text-transform:uppercase;letter-spacing:.05em;font-weight:600;background:var(--paper);position:sticky;top:0}
table.m thead th.today{background:var(--ink);color:var(--sheet)}
table.m th.p{text-align:left;min-width:200px;font-family:var(--f-body);font-weight:600;font-size:14px;text-transform:none;letter-spacing:0;background:var(--sheet)}
table.m th.p .code{display:block;font-family:var(--f-mono);font-size:11px;color:var(--ink-2);font-weight:400}
table.m td.cell{padding:0;height:46px;width:11%}
table.m td.weekend{background:var(--paper)}
.cellbtn{width:100%;height:100%;min-height:46px;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:4px}
.cellbtn:hover{background:var(--accent-soft)}
.cellbtn.on{background:var(--accent-soft);box-shadow:inset 3px 0 0 var(--plan)}
.cellbtn .h{font-family:var(--f-mono);font-size:13px;font-weight:500}
.cellbtn .pl{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--plan);font-weight:600}
.cellbtn.late{background:repeating-linear-gradient(135deg,transparent 0 6px,var(--line-2) 6px 7px)}
.cellbtn.late:hover{background:repeating-linear-gradient(135deg,transparent 0 6px,var(--line) 6px 7px)}
.cellbtn.conflict{box-shadow:inset 3px 0 0 var(--crit);cursor:pointer}
.cellbtn .pl.bad{color:var(--crit)}
.days label.off{opacity:.45;text-decoration:line-through;cursor:not-allowed}
.cellbtn .fin,.legend2 .sw .fin{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--ok);font-weight:700}
.cellbtn .dl{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--crit);font-weight:700}
table.m tfoot td,table.m tfoot th{font-weight:600;background:var(--paper)}
table.m td.tot{font-family:var(--f-mono)}
.hgrid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.hgrid label.f.today{color:var(--accent)}
.hgrid input{text-align:center}
.legend2{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:8px 16px;font-size:12.5px;color:var(--ink-2)}
.legend2 .lg-i{display:flex;gap:10px;align-items:center;min-width:0}
.legend2 .sw{flex:none;width:74px;height:38px;border:1px solid var(--line-2);background:var(--sheet);display:flex;align-items:center;justify-content:center}
.legend2 .sw.on{background:var(--accent-soft);box-shadow:inset 3px 0 0 var(--plan)}
.legend2 .sw .pl{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--plan);font-weight:600}
.legend2 .sw .h{font-family:var(--f-mono);font-size:13px;color:var(--ink)}
.legend2 .sw .dl{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--crit);font-weight:700}
.legend2 em{font-style:normal;color:var(--ink);font-weight:600}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-2)}
.legend i{display:inline-block;width:12px;height:12px;vertical-align:-2px;margin-right:5px;background:var(--accent-soft);box-shadow:inset 3px 0 0 var(--plan)}

/* Listă rămase */
.list{border:1px solid var(--line);background:var(--sheet)}
.li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 14px;padding:10px 14px;border-top:1px solid var(--line-2);align-items:center}
.li:first-child{border-top:0}
.li .n{font-weight:600;overflow-wrap:anywhere}
.li .s{font-size:12.5px;color:var(--ink-2)}

/* Modal */
.ov{position:fixed;inset:0;background:rgba(15,22,27,.55);display:flex;align-items:flex-start;justify-content:center;padding:max(24px,env(safe-area-inset-top,0px)) 16px 24px;overflow-y:auto;z-index:50}
.modal{background:var(--sheet);border:1.5px solid var(--ink);width:100%;max-width:560px;box-shadow:0 18px 50px rgba(0,0,0,.25)}
.modal header{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1.5px solid var(--ink)}
.modal header h2{margin:0;font-family:var(--f-disp);font-size:22px;text-transform:uppercase;letter-spacing:.04em}
.modal .x{border:0;background:transparent;font-size:22px;line-height:1;padding:2px 6px}
.modal form,.modal .mb{padding:14px 16px;display:flex;flex-direction:column;gap:12px}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:480px){.fg{grid-template-columns:1fr}}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-2);font-weight:600;min-width:0}
label.f input,label.f select,label.f textarea{text-transform:none;letter-spacing:0;font-weight:400;font-size:15px;color:var(--ink);background:var(--paper);border:1px solid var(--line);padding:8px 10px;width:100%;min-width:0}
label.f textarea{min-height:70px;resize:vertical}
.days{display:flex;gap:6px;flex-wrap:wrap}
.days label{display:flex;align-items:center;gap:4px;border:1px solid var(--line);padding:4px 8px;font-size:13px;cursor:pointer;text-transform:none;letter-spacing:0;color:var(--ink);font-weight:500}
.days input{accent-color:var(--accent)}
.modal .btns{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;padding-top:4px}
.modal .btns .r{display:flex;gap:8px;margin-left:auto}
.hint{font-size:12.5px;color:var(--ink-2)}
.confirm{border:1px solid var(--crit);background:var(--crit-soft);padding:8px 10px;font-size:13.5px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}

/* Sinteză */
.sumrow{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));border:1px solid var(--line);background:var(--sheet)}
.sumrow .stat .v{font-size:26px}
@media (max-width:760px){.sumrow{grid-template-columns:repeat(3,minmax(0,1fr))}.sumrow .stat{border-top:1px solid var(--line)}.sumrow .stat:nth-child(-n+3){border-top:0}.sumrow .stat:nth-child(3n+1){border-left:0}}
.board{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px;align-items:start}
.col{background:var(--sheet);border:1px solid var(--line);min-width:0}
.col>h4{margin:0;padding:8px 12px;font-family:var(--f-disp);font-size:17px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;display:flex;justify-content:space-between;gap:8px;border-top:4px solid var(--line);border-bottom:1px solid var(--line-2)}
.col.c-ok>h4{border-top-color:var(--ok)} .col.c-run>h4{border-top-color:var(--accent)} .col.c-wait>h4{border-top-color:var(--warn)} .col.c-stop>h4{border-top-color:var(--ink-2)} .col.c-idle>h4{border-top-color:var(--line)}
.col .it{padding:8px 12px;border-top:1px solid var(--line-2);display:flex;flex-direction:column;gap:3px}
.col .it:first-of-type{border-top:0}
.col .it .n{font-weight:600;overflow-wrap:anywhere}
.col .it .s{font-size:12.5px;color:var(--ink-2);overflow-wrap:anywhere}
.col .none{padding:10px 12px;font-size:13px;color:var(--ink-2)}
.hb{display:grid;grid-template-columns:minmax(0,180px) 1fr auto;gap:6px 12px;align-items:center;background:var(--sheet);border:1px solid var(--line);padding:12px 14px;font-size:13.5px}
.hb .lbl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hb .track{height:14px;background:var(--line-2);position:relative;min-width:0}
.hb .track i{position:absolute;inset:0 auto 0 0;background:var(--accent)}
.hb .track b{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink)}
@media (max-width:480px){.hb{grid-template-columns:minmax(0,1fr) auto}.hb .track{grid-column:1/-1;order:3}}
/* Echipă / proiecte comune */
.team{border:1px solid var(--line-2);font-size:13px}
.team .tr{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:4px 10px;padding:6px 8px;border-top:1px solid var(--line-2);align-items:center}
.team .tr:first-child{border-top:0}
.team .who{display:flex;gap:6px;align-items:center;min-width:0}
.team .who img{width:20px;height:20px;border-radius:50%;flex:none}
.team .who span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.team .task{grid-column:1/-1;color:var(--ink-2);font-size:12.5px;overflow-wrap:anywhere}
.chip.team-chip{border-color:var(--accent);color:var(--accent)}
.picker{display:flex;flex-direction:column;gap:6px}
.picked{display:flex;gap:6px;flex-wrap:wrap}
.pk{display:flex;align-items:center;gap:6px;border:1px solid var(--accent);background:var(--accent-soft);padding:2px 4px 2px 6px;font-size:13px;max-width:100%}
.pk img{width:18px;height:18px;border-radius:50%}
.pk span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pk button{border:0;background:transparent;font-size:16px;line-height:1;padding:0 4px;color:var(--ink-2)}
.hits{border:1px solid var(--line);background:var(--sheet);max-height:220px;overflow-y:auto}
.hit{display:flex;gap:8px;align-items:center;width:100%;text-align:left;border:0;border-top:1px solid var(--line-2);background:transparent;padding:6px 10px;font-size:14px}
.hit:first-child{border-top:0}
.hit:hover,.hit:focus-visible{background:var(--accent-soft)}
.hit img{width:22px;height:22px;border-radius:50%;flex:none}
.hit small{color:var(--ink-2)}
.fs{border:1px dashed var(--line);padding:10px 12px;display:flex;flex-direction:column;gap:10px}
.fs>.lg{font-family:var(--f-disp);font-size:15px;text-transform:uppercase;letter-spacing:.06em;font-weight:600}
/* fereastra de proiect: lată, pe 2 coloane, încape fără scroll */
.ov{padding:16px}
.modal{max-height:calc(100vh - 32px);display:flex;flex-direction:column}
.modal>form,.modal>.mb{overflow-y:auto;min-height:0}
.modal .btns{position:sticky;bottom:-14px;background:var(--sheet);padding-block:10px;margin-bottom:-14px;border-top:1px solid var(--line-2)}
.modal.wide{max-width:960px}
.modal.wide form{gap:8px;padding:12px 16px}
.modal.wide .fs{padding:8px 10px;gap:6px}
.modal.wide label.f{gap:3px;font-size:11px}
.modal.wide label.f input,.modal.wide label.f select,.modal.wide label.f textarea{padding:6px 8px;font-size:14px}
.modal.wide label.f textarea{min-height:52px}
.modal.wide .fg{gap:8px}
.modal.wide .days label{padding:2px 6px;font-size:12.5px}
.modal.wide .hint{font-size:12px}
.pf-cols{display:grid;grid-template-columns:1fr 1fr;gap:12px 18px;align-items:start}
.pf-col{display:flex;flex-direction:column;gap:8px;min-width:0}
@media (max-width:760px){.pf-cols{grid-template-columns:1fr}}
/* Sinteză: 5 coloane aliniate una lângă alta */
.board5wrap{overflow-x:auto}
.board5{overflow-x:auto;display:grid;grid-template-columns:repeat(3,minmax(190px,1fr));gap:10px;align-items:stretch}
.board5 .col{display:flex;flex-direction:column}
.board5 .col>h4{font-size:15px}
@media (max-width:1000px){.board5{grid-template-columns:repeat(3,220px)}}
/* KPI */
.kgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:1000px){.kgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:520px){.kgrid{grid-template-columns:1fr}}
.kt{background:var(--sheet);border:1px solid var(--line);border-top:4px solid var(--line);padding:10px 12px;display:flex;flex-direction:column;gap:4px;min-width:0}
.kt.ok{border-top-color:var(--ok)}.kt.warn{border-top-color:var(--warn)}.kt.crit{border-top-color:var(--crit)}

<script>
(function(){
"use strict";
/* ---------- utilitare dată (ora locală) ---------- */
const ZI=["Du","Lu","Ma","Mi","Jo","Vi","Sâ"];
const ZILE=["Duminică","Luni","Marți","Miercuri","Joi","Vineri","Sâmbătă"];
const LUNI=["ian","feb","mar","apr","mai","iun","iul","aug","sep","oct","nov","dec"];
const pad=n=>String(n).padStart(2,"0");
const iso=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const parse=s=>{const [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)};
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const monday=d=>{const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());const w=(x.getDay()+6)%7;return addDays(x,-w)};
const fmt=s=>{if(!s)return "—";const d=parse(s);return d.getDate()+" "+LUNI[d.getMonth()]};
const fmtLong=s=>{const d=parse(s);return ZILE[d.getDay()]+", "+d.getDate()+" "+LUNI[d.getMonth()]};
const diffDays=(a,b)=>Math.round((parse(a)-parse(b))/864e5);
const isoWeek=d=>{const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));const dn=t.getUTCDay()||7;t.setUTCDate(t.getUTCDate()+4-dn);const y0=new Date(Date.UTC(t.getUTCFullYear(),0,1));return Math.ceil(((t-y0)/864e5+1)/7)};
const h=n=>{const v=Math.round((+n||0)*100)/100;return (v%1===0?v.toFixed(0):v.toFixed(2).replace(/0$/,"")).replace(".",",")};
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const newId=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const lsGet=k=>{try{return localStorage.getItem(k)||""}catch(_){return ""}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,v)}catch(_){}};
const lsDel=k=>{try{localStorage.removeItem(k)}catch(_){}};

let TODAY=iso(new Date());
/* săptămâna de lucru: luni–vineri */
const weekRange=()=>{const m=monday(parse(TODAY));return [iso(m),iso(addDays(m,4))]};
const workDays=(start,n)=>{const out=[];let d=new Date(start);while(out.length<n){if(d.getDay()!==0&&d.getDay()!==6)out.push(iso(d));d=addDays(d,1)}return out};

/* ---------- stare ----------
   Contul Claude e comun, deci totul stă în același spațiu privat al contului:
   data/users/<cont>/planner/
     persons/<pid>            nume, email, dimineata, seara, pwSalt, pwHash
     proj/<id>                date proiect (comune), members[] = persoane, createdBy
     plan/<persoana>__<proj>  partea fiecăruia: zile, oreEstimate, sarcina, stare, finalizatLa
     hours/<id>               projectId, personId, data, ore, nota
     state/timer_<persoana>   cronometrul fiecăruia */
const S={db:null,base:null,me:null,persons:[],proj:[],plan:{},hours:[],logs:[],timer:null,projects:[],
  tab:"azi",weekStart:monday(new Date()),loaded:{pe:false,pr:false,pl:false,h:false},timerUnsub:null};
try{const t=localStorage.getItem("pp-tab");if(t)S.tab=t}catch(e){}

const col=n=>S.base.collection(n);
const personRef=id=>col("persons").doc(id);
const projRef=id=>col("proj").doc(id);
const planRef=(pe,pid)=>col("plan").doc(pe+"__"+pid);
const hourRef=id=>col("hours").doc(id);
const timerRef=()=>col("state").doc("timer_"+S.me);
const ck=(pe,pid)=>pe+"__"+pid;
const meP=()=>S.persons.find(p=>p.id===S.me)||{};
const nameOf=id=>id===S.me?"Eu":((S.persons.find(p=>p.id===id)||{}).nume||"(persoană ștearsă)");
const realName=id=>(S.persons.find(p=>p.id===id)||{}).nume||"—";

function merge(pd){
  const mine=S.plan[ck(S.me,pd.id)]||{};
  const members=pd.members||[];const multi=members.length>1;
  const projDone=pd.status==="finalizat";
  return Object.assign({},pd,{kind:multi?"s":"p",members,
    zile:mine.zile||[],oreEstimate:+mine.oreEstimate||0,sarcina:mine.sarcina||"",myDone:mine.stare==="finalizat",
    projStatus:pd.status||"activ",
    status:projDone?"finalizat":(multi&&mine.stare==="finalizat")?"finalizat":(pd.status||"activ"),
    finalizatLa:projDone?(pd.finalizatLa||""):(multi?(mine.finalizatLa||""):"")});
}
const CO="concediu";
const leaveDay=d=>(S.leave||[]).filter(l=>!isL(l)&&l.data===d).reduce((a,l)=>a+(+l.ore||0),0);
/* concediu în perioadă; cel lunar (fără zile) intră doar dacă luna întreagă e în perioadă */
const leaveIn=(from,to)=>(S.leave||[]).filter(l=>l.data>=from&&l.data<=to&&(!isL(l)||from<=l.data.slice(0,8)+"01")).reduce((a,l)=>a+(+l.ore||0),0);
function rebuild(){
  const mineH=S.hours.filter(l=>l.personId===S.me);
  S.logs=mineH.filter(l=>l.projectId!==CO);
  S.leave=mineH.filter(l=>l.projectId===CO);
  S.projects=S.me?S.proj.filter(p=>(p.members||[]).includes(S.me)).map(merge):[];
  renderAll();
}

/* ---------- urgență ---------- */
function urg(p){
  if(p.status==="finalizat")return {lvl:"done",label:p.kind==="s"&&p.projStatus!=="finalizat"?"Partea mea finalizată":"Finalizat",cls:"ok"};
  if(p.status==="oprit")return {lvl:"stop",label:"Oprit"+(p.opritLa?" din "+fmt(p.opritLa):""),cls:"mute"};
  const days=p.termen?diffDays(p.termen,TODAY):null;
  if(days!==null&&days<0)return {lvl:"crit",label:"Termen depășit cu "+(-days)+(days===-1?" zi":" zile"),cls:"crit",days};
  if(days!==null&&days<=2)return {lvl:"urg",label:days===0?"Termen azi":days===1?"Termen mâine":"Termen în 2 zile",cls:"crit",days};
  if(p.prioritate==="urgenta")return {lvl:"urg",label:"Marcat urgent",cls:"crit",days};
  const wEnd=weekRange()[1];
  if(days!==null&&p.termen<=wEnd)return {lvl:"week",label:"Termen săptămâna asta",cls:"warn",days};
  if(days!==null&&days<=7)return {lvl:"week",label:"Termen în "+days+" zile",cls:"warn",days};
  if(p.status==="asteptare")return {lvl:"wait",label:"În așteptare",cls:"mute",days};
  return {lvl:"ok",label:p.termen?"În grafic":"Fără termen",cls:p.termen?"info":"mute",days};
}
const RANK={crit:0,urg:1,week:2,ok:3,wait:4,stop:5,done:6};
/* pontaj lunar importat: o înregistrare pe lună (lunar:true), fără defalcare pe zile */
const isL=l=>!!l.lunar;
const dayHrs=(pid,d)=>S.logs.filter(l=>!isL(l)&&l.projectId===pid&&l.data===d).reduce((a,l)=>a+(+l.ore||0),0);
const hoursFor=(pid,from,to)=>S.logs.filter(l=>l.projectId===pid&&(!from||l.data>=from)&&(!to||l.data<=to)).reduce((a,l)=>a+(+l.ore||0),0);
const personHours=(pe,pid,from,to)=>S.hours.filter(l=>l.personId===pe&&l.projectId===pid&&(!from||l.data>=from)&&(!to||l.data<=to)).reduce((a,l)=>a+(+l.ore||0),0);
const teamHours=(p,from,to)=>S.hours.filter(l=>l.projectId===p.id&&(!from||l.data>=from)&&(!to||l.data<=to)).reduce((a,l)=>a+(+l.ore||0),0);
const active=()=>S.projects.filter(p=>p.status!=="finalizat"&&p.status!=="oprit");
const stopped=()=>S.projects.filter(p=>p.status==="oprit");
const byUrg=(a,b)=>(RANK[urg(a).lvl]-RANK[urg(b).lvl])||((a.termen||"9999")<(b.termen||"9999")?-1:1)||String(a.nume).localeCompare(String(b.nume));
const afterDeadline=(p,d)=>!!p.termen&&d>p.termen&&p.status!=="finalizat";
const AD="admin",AD_N="Admin – activități interne";
/* faza în care era proiectul la o dată: etapele predate au faza lor până la data predării, apoi faza curentă */
const fazaAt=(p,d)=>{if(!p)return "";const et=[...(p.etape||[])].filter(e=>e.finalizatLa).sort((a,b)=>a.finalizatLa.localeCompare(b.finalizatLa));const e=et.find(e=>d<=e.finalizatLa&&(!p.etapaStart||d<p.etapaStart));return (e?e.faza:p.faza)||""};
const pname=id=>{if(id===AD)return AD_N;if(id==="concediu")return "Concediu odihnă";const p=S.proj.find(x=>x.id===id);return p?(p.parentId?p.nume+" – "+(p.livrabil||"livrabil paralel"):p.nume):"(proiect șters)"};
/* livrabile în paralel (23.10.2026): un livrabil paralel e o fișă proprie (ore, termen, zile, stare),

/* ---------- scriere ---------- */
async function write(fn,okMsg){
  if(!S.db||!S.base){toast("Planificatorul nu e disponibil în această vizualizare.");return false}
  try{await fn();if(okMsg)toast(okMsg);return true}
  catch(e){
    if(e&&e.code==="unavailable"){await sleep(600+Math.random()*600);try{await fn();if(okMsg)toast(okMsg);return true}catch(e2){}}
    console.error(e);
    toast(e&&e.code==="invalid_argument"?"Nu ai drept de scriere în planificator.":e&&e.code==="quota_exceeded"?"Baza de date e plină. Șterge proiecte vechi.":"Nu s-a putut salva. Încearcă din nou.");return false}
}

/* ---------- parole (hash SHA-256 cu sare; nu se păstrează parola) ---------- */
async function hashPw(salt,pw){
  const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(salt+"|"+pw));
  return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("");
}
const newSalt=()=>[...crypto.getRandomValues(new Uint8Array(12))].map(x=>x.toString(16).padStart(2,"0")).join("");

function viewFin(){
  /* Finalizate pe săptămâni, cu săgeți (13.10.2026): toate lucrările predate în săptămâna aleasă,
     inclusiv etapele predate anterior pe proiecte care au continuat cu o lucrare nouă */
  const ws=S.weekStart,from=iso(ws),to=iso(addDays(ws,6));
  const all=S.projects.flatMap(p=>lucrFin(p).map(x=>({p,x})));
  const wk=all.filter(({x})=>x.fin>=from&&x.fin<=to).sort((a,b)=>b.x.fin.localeCompare(a.x.fin)||String(a.p.nume).localeCompare(String(b.p.nume)));
  let html=weekNav(ws);
  if(!all.length)return html+`<div class="empty">Încă nimic finalizat. Când predai o lucrare, în „Editează” alegi starea „Lucrare finalizată / predată” și apare aici, în săptămâna predării.</div>`;
  const tot=wk.reduce((a,{x})=>a+x.ore,0);
  html+=`<div class="section-h">Finalizate în săptămână<span>${fmt(from)} – ${fmt(iso(addDays(ws,4)))} · ${wk.length} ${wk.length===1?"lucrare":"lucrări"}${wk.length?" · "+h(tot)+" h":""}</span></div>`;
  const row=({p,x})=>{const late=x.termen&&x.fin>x.termen;return `<div class="li"><div style="min-width:0"><div class="n">${esc(p.nume)}${p.cod?` <span class="num" style="font-weight:400;color:var(--ink-2);font-size:12px">${esc(p.cod)}</span>`:""}${p.kind==="s"?" · comun":""}</div><div class="s">${esc([x.faza,x.livrabil].filter(Boolean).join(" · "))}${x.faza||x.livrabil?" · ":""}predat ${fmtLong(x.fin)}${x.termen?" (termen "+fmt(x.termen)+")":""} · <span class="num">${h(x.ore)} h</span></div></div><div class="row">${x.termen?`<span class="chip ${late?"warn":"ok"}">${late?"După termen":"La termen"}</span>`:""}<button class="btn sm" data-act="edit" data-id="${p.id}">Editează</button></div></div>`};
  html+=wk.length?`<div class="list">${wk.map(row).join("")}</div>`:`<div class="empty">Nimic predat în săptămâna aceasta. Folosește săgețile ca să vezi alte săptămâni.</div>`;
  return html;
}

/* fila Proiecte: toate proiectele după starea ÎNTREGULUI proiect (13.10.2026)
   În lucru = proiect în desfășurare, neoprit (chiar dacă lucrarea pe faza curentă e predată)
   Oprite   = starea lucrării „Oprit / suspendat”
   Încheiate = „Proiect încheiat” din Editează → Stare proiect */
function renderProjList(){
  const el=document.getElementById("projlist");
  if(!S.me||!allLoaded()||!S.projects.length){el.innerHTML="";return}
  const byN=(a,b)=>String(a.nume).localeCompare(String(b.nume),"ro");
  const R=S.projects.filter(p=>!p.parentId||!S.proj.some(x=>x.id===p.parentId));
  const closed=R.filter(p=>projClosed(p.id)).sort(byN);
  const stop=R.filter(p=>!projClosed(p.id)&&p.status==="oprit").sort(byN);
  const run=R.filter(p=>!projClosed(p.id)&&p.status!=="oprit").sort(byN);
  const nm=p=>`<button type="button" class="pl-n" data-act="edit" data-id="${p.id}" title="${esc(p.nume)}${p.cod?" · "+esc(p.cod):""} — click: Editează">${esc(p.nume)}</button>`;
  const colm=(cls,title,arr)=>`<div class="pl-c ${cls}"><div class="pl-h">${title} <span class="num">${arr.length}</span></div><div class="pl-l">${arr.length?arr.map(nm).join(""):`<span class="pl-e">—</span>`}</div></div>`;

function synth(from,to,withL){

  const wh=p=>S.logs.filter(l=>ok(l)&&l.projectId===p.id&&l.data>=from&&l.data<=to).reduce((a,l)=>a+(+l.ore||0),0);
  const planned=p=>(p.zile||[]).filter(inW);
  const worked=p=>[...new Set(S.logs.filter(l=>l.projectId===p.id&&inW(l.data)).map(l=>l.data))];
  const late=p=>p.status!=="finalizat"&&p.status!=="oprit"&&p.termen&&p.termen<=to&&p.termen<TODAY;
  const g={fin:[],run:[],wait:[],stop:[],idle:[]};
  for(const p of S.projects){

    if(p.status==="oprit"){g.stop.push(p);continue}
    /* „În așteptare” nu mai are coloană proprie (13.10.2026): proiectul e tot în lucru */
    if(p.status==="asteptare"){g.run.push(p);continue}
    if(p.creatLa&&p.creatLa>to)continue;
    (wh(p)>0||planned(p).length?g.run:g.idle).push(p);

  const pl=S.projects.reduce((a,p)=>a+planned(p).length,0);

  const co=withL?leaveIn(from,to):(S.leave||[]).filter(l=>!isL(l)&&inW(l.data)).reduce((a,l)=>a+(+l.ore||0),0);
  const ad=S.logs.filter(l=>ok(l)&&l.projectId===AD&&inW(l.data)).reduce((a,l)=>a+(+l.ore||0),0);

}

/* ---------- intrare: alege persoana + parola ---------- */
let gateState={step:"pick",pid:null};
function renderGate(){
  let g=document.getElementById("gate");
  if(S.me||!allLoaded()){if(g)g.remove();return}
  if(!g){g=document.createElement("div");g.id="gate";g.className="ov";g.style.zIndex="70";document.body.appendChild(g)}
  const ps=[...S.persons].sort((a,b)=>String(a.nume).localeCompare(String(b.nume)));
  let inner="";
  if(gateState.step==="pick"){
    inner=`<header><h2>Cine ești?</h2></header><div class="mb">
      ${ps.length?`<div class="hits" style="max-height:none">${ps.map(p=>`<button type="button" class="hit" data-gate-pick="${esc(p.id)}"><span><strong>${esc(p.nume)}</strong>${p.pwHash?"":" <small>· setează parola la prima intrare</small>"}</span></button>`).join("")}</div>`:`<div class="empty">Nu există încă nicio persoană.</div>`}
      <button type="button" class="btn" data-gate-new="1">+ Sunt nou / nouă în planificator</button>
      ${ps.length?"":`<button type="button" class="btn ghost" data-gate-restore="1">Restaurez dintr-o copie de siguranță (.json)</button>`}
      <div class="hint">Contul de Claude e comun, așa că fiecare intră în planificator cu numele și parola lui. Proiectele și orele tale le vezi doar tu și colegii cu care partajezi un proiect.</div></div>`;
  }else if(gateState.step==="login"){
    const p=S.persons.find(x=>x.id===gateState.pid)||{};const set=!p.pwHash;
    inner=`<header><h2>${esc(p.nume||"")}</h2></header><form class="mb" id="gate-f">
      <label class="f">${set?"Alege o parolă (minim 4 caractere)":"Parola"}<input type="password" id="g-pw" autocomplete="${set?"new-password":"current-password"}" required></label>
      ${set?`<label class="f">Repetă parola<input type="password" id="g-pw2" autocomplete="new-password" required></label>`:""}
      <label class="f" style="flex-direction:row;align-items:center;gap:8px;text-transform:none;letter-spacing:0;font-size:14px;color:var(--ink)"><input type="checkbox" id="g-rem" style="width:auto" checked>Ține-mă minte pe acest calculator</label>
      <div id="g-err" class="hint" style="color:var(--crit)"></div>
      <div class="btns"><button type="button" class="btn ghost" data-gate-back="1">← Înapoi</button><div class="r"><button class="btn primary" type="submit">${set?"Setează parola și intră":"Intră"}</button></div></div>
      ${set?"":`<div class="hint">Ai uitat parola? Cere persoanei care administrează planificatorul să ți-o reseteze (o face prin Claude).</div>`}</form>`;
  }else{
    inner=`<header><h2>Persoană nouă</h2></header><form class="mb" id="gate-n">
      <label class="f">Nume (cum te văd colegii)<input id="n-nume" required placeholder="ex. Laura"></label>
      <label class="f">Email pentru notificări<input type="email" id="n-email" placeholder="ex. nume@briskgrp.com"></label>
      <label class="f">Parolă (minim 4 caractere)<input type="password" id="n-pw" autocomplete="new-password" required></label>
      <label class="f">Repetă parola<input type="password" id="n-pw2" autocomplete="new-password" required></label>
      <div id="n-err" class="hint" style="color:var(--crit)"></div>
      <div class="btns"><button type="button" class="btn ghost" data-gate-back="1">← Înapoi</button><div class="r"><button class="btn primary" type="submit">Creează și intră</button></div></div></form>`;
  }
  const key=gateState.step+"|"+gateState.pid+"|"+ps.map(p=>p.id+(p.pwHash?1:0)).join(",");
  if(g.dataset.key===key)return;
  g.dataset.key=key;
  g.innerHTML=`<div class="modal" role="dialog" aria-modal="true" aria-label="Intrare">${inner}</div>`;
  const f=g.querySelector("input");if(f)f.focus();
  const lf=g.querySelector("#gate-f");
  if(lf)lf.addEventListener("submit",async e=>{e.preventDefault();
    const p=S.persons.find(x=>x.id===gateState.pid);if(!p)return;
    const pw=g.querySelector("#g-pw").value,err=g.querySelector("#g-err");
    if(!p.pwHash){
      if(pw.length<4){err.textContent="Parola trebuie să aibă minim 4 caractere.";return}
      if(pw!==g.querySelector("#g-pw2").value){err.textContent="Parolele nu coincid.";return}
      const salt=newSalt();const hash=await hashPw(salt,pw);
      if(!await write(()=>personRef(p.id).update({pwSalt:salt,pwHash:hash}),"Parolă setată"))return;
    }else{
      if(await hashPw(p.pwSalt||"",pw)!==p.pwHash){err.textContent="Parolă greșită.";g.querySelector("#g-pw").select();return}
    }
    login(p.id,g.querySelector("#g-rem").checked);
  });
  const nf=g.querySelector("#gate-n");
  if(nf)nf.addEventListener("submit",async e=>{e.preventDefault();
    const nume=g.querySelector("#n-nume").value.trim(),email=g.querySelector("#n-email").value.trim(),pw=g.querySelector("#n-pw").value,err=g.querySelector("#n-err");
    if(!nume){err.textContent="Completează numele.";return}
    if(S.persons.some(x=>String(x.nume).toLowerCase()===nume.toLowerCase())){err.textContent="Există deja o persoană cu acest nume.";return}
    if(email&&!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)){err.textContent="Adresa de email nu pare validă.";return}
    if(pw.length<4){err.textContent="Parola trebuie să aibă minim 4 caractere.";return}
    if(pw!==g.querySelector("#n-pw2").value){err.textContent="Parolele nu coincid.";return}
    const id=newId(),salt=newSalt(),hash=await hashPw(salt,pw);
    if(await write(()=>personRef(id).set({nume,email,dimineata:true,seara:true,pwSalt:salt,pwHash:hash,creatLa:TODAY}),"Bun venit, "+nume+"!"))login(id,true);
  });
}
document.addEventListener("click",e=>{
  const g=e.target.closest("#gate");if(!g)return;
  const pick=e.target.closest("[data-gate-pick]"),nw=e.target.closest("[data-gate-new]"),bk=e.target.closest("[data-gate-back]");
  if(pick){gateState={step:"login",pid:pick.dataset.gatePick};renderGate()}
  else if(nw){gateState={step:"new",pid:null};renderGate()}
  else if(bk){gateState={step:"pick",pid:null};renderGate()}
  else if(e.target.closest("[data-gate-restore]"))importBackupModal();
});
function login(id,remember){
  S.me=id;gateState={step:"pick",pid:null};
  if(remember)lsSet("pp-me",id);else lsDel("pp-me");
  subscribeTimer();rebuild();maybePopup();
}
function logout(){
  S.me=null;lsDel("pp-me");if(S.timerUnsub){S.timerUnsub();S.timerUnsub=null}S.timer=null;closeModal();rebuild();
}
function subscribeTimer(){
  if(S.timerUnsub){S.timerUnsub();S.timerUnsub=null}
  if(!S.me)return;

}

/* ---------- copie de siguranță (02.11.2026): export / import JSON, pentru mutare pe alt cont Claude ---------- */
function backupObj(){
  const o=a=>Object.fromEntries(a.map(x=>{const d={...x};delete d.id;return [x.id,d]}));
  return {app:"planificator-proiecte",format:1,exportatLa:new Date().toISOString(),exportatDe:meP().nume||"",
    colectii:{persons:o(S.persons),proj:o(S.proj),plan:Object.fromEntries(Object.entries(S.plan)),hours:o(S.hours),settings:{faze:{list:S.fazeCustom||[]}}}};
}
async function exportBackup(){
  const dl=window.claude&&window.claude.use?await window.claude.use("downloads"):null;
  if(!dl){toast("Descărcarea nu e disponibilă în această vizualizare.");return}
  const txt=JSON.stringify(backupObj(),null,1);
  try{await dl.save({filename:"planificator-backup-"+TODAY+".json",data:new Blob([txt],{type:"application/json"})});toast("Copia de siguranță a fost descărcată")}
  catch(err){if(err&&err.code==="declined")return;toast("Copia nu s-a putut descărca.")}
}
function importBackupModal(){
  openModal("Restaurez dintr-o copie de siguranță",`<div class="mb">
    <div class="hint">Alege fișierul <b>planificator-backup-….json</b>. Persoanele, proiectele, planurile, orele, avizele și fazele din fișier se scriu în planificator. Ce există deja cu același identificator se înlocuiește; restul rămâne.</div>
    <input type="file" id="bk-f" accept=".json,application/json">
    <div id="bk-info" class="hint"></div>
    <div class="btns"><div class="r"><button type="button" class="btn ghost" data-act="close">Renunță</button><button type="button" class="btn primary" id="bk-go" disabled>Restaurez</button></div></div></div>`,r=>{
    {const ov=r.querySelector(".ov");if(ov)ov.style.zIndex="80"}
    let data=null;const info=r.querySelector("#bk-info"),go=r.querySelector("#bk-go");
    r.querySelector("#bk-f").addEventListener("change",async e=>{const f=e.target.files[0];data=null;go.disabled=true;if(!f)return;
      try{const j=JSON.parse(await f.text());if(j.app!=="planificator-proiecte"||!j.colectii)throw 0;data=j;
        const c=j.colectii,n=k=>Object.keys(c[k]||{}).length;
        info.innerHTML=`Copie din <b>${esc((j.exportatLa||"").slice(0,10))}</b>${j.exportatDe?" ("+esc(j.exportatDe)+")":""}: ${n("persons")} persoane, ${n("proj")} proiecte, ${n("plan")} planuri, ${n("hours")} înregistrări de ore.`;go.disabled=false}
      catch(_){info.innerHTML=`<span style="color:var(--crit)">Fișierul nu e o copie de siguranță a planificatorului.</span>`}});
    go.addEventListener("click",async()=>{if(!data)return;
      if(go.dataset.sure!=="1"){go.dataset.sure="1";go.textContent="Sigur? Restaurez acum";go.classList.add("danger");return}
      go.disabled=true;go.textContent="Se restaurează…";
      const c=data.colectii;let k=0;
      const ok=await write(async()=>{for(const name of ["persons","proj","plan","hours","settings"])for(const [id,d] of Object.entries(c[name]||{})){await col(name).doc(id).set(d);if(++k%20===0)info.textContent="Scrise "+k+" documente…"}},"Restaurare încheiată");
      if(ok){info.textContent="Gata: "+k+" documente scrise.";setTimeout(closeModal,900)}else{go.disabled=false;go.textContent="Restaurez"}});
  });
}

/* ---------- selector colegi: bifezi persoanele din planificator ---------- */
function mountPicker(r,sel){
  const box=r.querySelector("#pk-box");
  const draw=()=>{
    const ps=S.persons.filter(p=>p.id!==S.me).sort((a,b)=>String(a.nume).localeCompare(String(b.nume)));
    box.innerHTML=(ps.length?`<div class="days">${ps.map(p=>`<label><input type="checkbox" value="${esc(p.id)}" ${sel.includes(p.id)?"checked":""}>${esc(p.nume)}${p.pwHash?"":" <small style=\"color:var(--ink-2)\">(n-a intrat încă)</small>"}</label>`).join("")}</div>`:`<span class="hint">Încă nu ai adăugat colegi.</span>`)
      +`<div id="pk-add-w" style="margin-top:8px"><button type="button" class="btn sm" id="pk-add">+ Adaugă un coleg</button></div>`;
    box.querySelector("#pk-add").addEventListener("click",()=>{
      const w=box.querySelector("#pk-add-w");
      w.innerHTML=`<div class="fg"><label class="f">Nume coleg<input id="pk-nume" placeholder="ex. Ana"></label><label class="f">Email (pentru notificări)<input type="email" id="pk-email" placeholder="ex. ana@briskgrp.com"></label></div>
        <div class="row" style="margin-top:6px"><button type="button" class="btn sm primary" id="pk-save">Adaugă și bifează</button><button type="button" class="btn sm ghost" id="pk-cancel">Renunță</button><span class="hint" id="pk-err" style="color:var(--crit)"></span></div>
        <div class="hint">Colegul își alege parola la prima intrare, când selectează numele lui în „Cine ești?”.</div>`;
      w.querySelector("#pk-nume").focus();
      w.querySelector("#pk-cancel").addEventListener("click",draw);
      w.querySelector("#pk-save").addEventListener("click",async()=>{
        const nume=w.querySelector("#pk-nume").value.trim(),email=w.querySelector("#pk-email").value.trim(),er=w.querySelector("#pk-err");
        if(!nume){er.textContent="Completează numele.";return}
        if(S.persons.some(x=>String(x.nume).toLowerCase()===nume.toLowerCase())){er.textContent="Există deja o persoană cu acest nume.";return}
        if(email&&!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)){er.textContent="Emailul nu pare valid.";return}
        const id=newId();
        if(await write(()=>personRef(id).set({nume,email,dimineata:true,seara:true,creatLa:TODAY,adaugatDe:S.me}),nume+" a fost adăugat(ă)")){
          S.persons.push({id,nume,email});sel.push(id);draw();
          const sw=r.querySelector("#pf-sarcina-w");if(sw)sw.hidden=false;
        }
      });
    });
  };
  draw();
  box.addEventListener("change",e=>{const i=e.target;if(!i.matches("input[type=checkbox]"))return;
    if(i.checked){if(!sel.includes(i.value))sel.push(i.value)}else{const k=sel.indexOf(i.value);if(k>=0)sel.splice(k,1)}
    const sw=r.querySelector("#pf-sarcina-w");if(sw)sw.hidden=!sel.length&&!r.dataset.shared});
}

const AV_LIST=["Certificat de urbanism (CU)","Autorizație de construire (AC)","Autorizație de desființare (AD)","Autorizație de securitate la incendiu (ISU)","Alimentare cu apă și canalizare","Alimentare cu energie electrică","Alimentare cu gaze naturale","Alimentare cu energie termică","Telefonizare","Salubritate","Transport urban","Securitate la incendiu (ISU)","Protecție civilă","Sănătatea populației (DSP)","Protecția mediului (APM)","Cultură (DJC / Ministerul Culturii)","Siguranța circulației (Poliția Rutieră)","Comisia Tehnică de Circulație","Gospodărirea apelor (ABA)","Administratorul drumului (CNAIR / CJ)","Studiu geotehnic","Acord vecini"];
/* termene legale de emitere (regim anterior CATUC: Legea 50/1991 și legi speciale) – implicite, se pot modifica pe aviz */
const AV_TERM=[
  [/certificat de urbanism|\(CU\)/i,15,"Legea 50/1991, art. 6 – CU: max. 15 zile de la înregistrare"],
  [/autoriza[țt]ie de construire|\(AC\)|desfiin[țt]are|\(AD\)/i,30,"Legea 50/1991, art. 7 alin. (1) – AC/AD: max. 30 zile de la înregistrare"],
  [/cultur/i,30,"Legea 422/2001 – aviz Cultură: 30 zile (de verificat)"],
  [/mediu|APM/i,0,"Procedura de mediu (Legea 292/2018) – fără termen unic"],
  [/./,15,"Legea 50/1991, art. 7 – avize/acorduri cerute prin CU: 15 zile calendaristice de la înregistrare"]];
const avTermDef=n=>{const r=AV_TERM.find(([re])=>re.test(n));return {z:r[1],t:r[2]}};
const avTerm=x=>x.termenZile!=null&&x.termenZile!==""?{z:+x.termenZile,t:x.termenTemei||"termen setat manual"}:avTermDef(x.nume);
const avDue=x=>{if(!x.depusLa)return "";const t=avTerm(x);return t.z?iso(addDays(parse(x.depusLa),t.z)):""};
const isDoc=n=>/certificat de urbanism|\(CU\)|autoriza[țt]ie de (construire|desfiin)|\(AC\)|\(AD\)/i.test(n);
const avRank=a=>/certificat de urbanism|\(CU\)/i.test(a.nume)?0:isDoc(a.nume)?2:1;
const srcLbl=a=>isDoc(a.nume)?"documentație":a.sursa==="CU"?"cerut prin CU":"adăugat";
const AV_ST={necesar:["De depus","warn"],depus:["Depus · în așteptare","info"],obtinut:["Obținut","ok"]};
const avOf=pid=>{const d=S.proj.find(x=>x.id===rootOf(pid));return (d&&d.avize)||[]};
const avCount=a=>({n:a.filter(x=>x.stare==="necesar").length,d:a.filter(x=>x.stare==="depus").length,o:a.filter(x=>x.stare==="obtinut").length,t:a.length});
const daysSince=d=>Math.round((parse(TODAY)-parse(d))/864e5);
function avizeHTML(av){
  const c=avCount(av);const locs=[...new Set(av.map(x=>x.loc).filter(Boolean))].sort((a,b)=>a.localeCompare(b,"ro"));

    const dt=x.stare==="depus"?x.depusLa:x.stare==="obtinut"?x.obtinutLa:"";
    return `<div class="av-row" data-av="${esc(x.id)}">
      <div class="av-n"><b>${esc(x.nume)}</b><span class="code">${srcLbl(x)}${x.stare==="depus"&&x.depusLa?` · depus ${fmt(x.depusLa)} · ${daysSince(x.depusLa)} zile în așteptare${avDue(x)?` · termen legal ${fmt(avDue(x))}${avDue(x)<TODAY?" (depășit)":""}`:""}`:""}${x.stare==="obtinut"&&x.depusLa?` · depus ${fmt(x.depusLa)}`:""}</span></div>
      <select class="av-st" aria-label="Stare aviz">${Object.entries(AV_ST).map(([k,[l]])=>`<option value="${k}" ${x.stare===k?"selected":""}>${l}</option>`).join("")}</select>

      <input class="av-nr" value="${esc(x.nr||"")}" placeholder="${x.stare==="obtinut"?"nr. aviz":"nr. înregistrare"}" ${x.stare==="necesar"?'style="visibility:hidden"':""} aria-label="Număr">
      <button type="button" class="av-del" title="Șterge avizul" aria-label="Șterge avizul">×</button>
    </div>`};
  const used=new Set(av.map(x=>x.nume));
  return `<div class="av-sum"><span class="chip warn">De depus ${c.n}</span><span class="chip info">Depuse, în așteptare ${c.d}</span><span class="chip ok">Obținute ${c.o}</span><span class="hint">din ${c.t} avize</span></div>
    <div class="av-list">${!av.length?`<div class="hint" style="padding:8px 0">Niciun aviz încă. Adaugă-le mai jos, din lista din CU.</div>`
      :locs.length?[...locs,""].map(l=>{const g=av.filter(x=>(x.loc||"")===l);if(!g.length)return "";const gc=avCount(g);
        const cs=[...new Set(g.map(x=>x.cu||""))].sort((a,b)=>a.localeCompare(b,"ro",{numeric:true}));
        return `<div class="av-loc"><b>${esc(l||"Comune tuturor locațiilor")}</b> <span class="hint">${gc.o}/${gc.t} obținute</span></div>`+cs.map(cu=>{const h=g.filter(x=>(x.cu||"")===cu),hc=avCount(h);
          return (cu?`<div class="av-cu"><b>${esc(cu)}</b> <span class="hint">${hc.o}/${hc.t} obținute${hc.d?` · ${hc.d} depuse`:""}${hc.n?` · ${hc.n} de depus`:""}</span></div>`:"")+["necesar","depus","obtinut"].map(st=>h.filter(x=>x.stare===st).sort((a,b)=>String(a.nume).localeCompare(String(b.nume),"ro",{numeric:true})).map(row).join("")).join("")}).join("")}).join("")
      :["necesar","depus","obtinut"].map(st=>av.filter(x=>x.stare===st).sort((a,b)=>avRank(a)-avRank(b)).map(row).join("")).join("")}</div>
    <div class="fs"><div class="lg">Adaug aviz</div>
      <div class="av-add">${locs.length?`<select id="av-new-loc" aria-label="Locația / certificatul de urbanism">${locs.map(l=>{const cs=[...new Set(av.filter(x=>x.loc===l).map(x=>x.cu).filter(Boolean))].sort((a,b)=>a.localeCompare(b,"ro",{numeric:true}));
        return cs.length?`<optgroup label="${esc(l)}">${cs.map(c=>`<option value="${esc(l+"||"+c)}">${esc(c)}</option>`).join("")}</optgroup>`:`<option value="${esc(l)}">${esc(l)}</option>`}).join("")}<option value="">comun tuturor locațiilor</option></select>`:""}<input id="av-new" list="av-dl" placeholder="ex. Securitate la incendiu (ISU) — sau scrii alt aviz"><datalist id="av-dl">${AV_LIST.filter(n=>!used.has(n)).map(n=>`<option value="${esc(n)}">`).join("")}</datalist>
      <select id="av-new-src"><option value="CU">cerut prin CU</option><option value="manual">adăugat de mine</option></select>
      <select id="av-new-st"><option value="necesar">De depus</option><option value="depus">Depus deja</option><option value="obtinut">Obținut deja</option></select>
      <button type="button" class="btn sm primary" id="av-add">+ Adaugă</button></div>
      <div class="av-quick">${AV_LIST.filter(n=>!used.has(n)).slice(0,12).map(n=>`<button type="button" class="btn sm ghost" data-q="${esc(n)}">+ ${esc(n)}</button>`).join("")}</div>
    </div>
    <div class="hint">Avizele se salvează imediat și sunt comune pentru toți cei cu care e partajat proiectul. Când depui un aviz, alegi „Depus” și data depunerii; când îl primești, „Obținut” și data.</div>`;
}
function mountAvize(r,pid){
  pid=rootOf(pid);
  const box=r.querySelector("#pf-tab-av");let av=JSON.parse(JSON.stringify(avOf(pid)));
  const tabBtn=r.querySelector('[data-pft="av"]');
  const draw=()=>{box.innerHTML=avizeHTML(av);const c=avCount(av);if(tabBtn)tabBtn.textContent=`Avize${c.t?` (${c.o}/${c.t})`:""}`};
  const save=async msg=>{const clean=av.filter(a=>!a._new).map(a=>{const o={...a};delete o._new;Object.keys(o).forEach(k=>{if(o[k]===undefined)delete o[k]});return o});await write(()=>projRef(pid).update({avize:clean}),msg);draw()};
  box.addEventListener("change",e=>{const rw=e.target.closest("[data-av]");if(!rw)return;const x=av.find(a=>a.id===rw.dataset.av);if(!x)return;
    if(e.target.classList.contains("av-st")){const st=e.target.value;
      if(st==="necesar"){x.stare=st;x.depusLa="";x.obtinutLa="";save("„"+x.nume+"”: de depus");return}
      /* depus / obținut: cer data (implicit azi) și numărul înainte de salvare */
      box.querySelectorAll(".av-ask").forEach(n=>n.remove());
      const dep=st==="depus";const ask=document.createElement("div");ask.className="av-ask";
      ask.innerHTML=`<b>${dep?(isDoc(x.nume)?"Depun documentația":"Depun avizul"):(isDoc(x.nume)?"Am obținut":"Am obținut avizul")} „${esc(x.nume)}”</b>
        <label>${dep?"Data depunerii *":"Data obținerii *"}<input type="date" class="aa-d" max="${TODAY}" required value="${esc((dep?x.depusLa:x.obtinutLa)||"")}"></label>
        ${!dep&&!x.depusLa?`<label>Data depunerii (opțional)<input type="date" class="aa-d0" max="${TODAY}"></label>`:""}
        <label>${dep?"Nr. înregistrare":"Nr. aviz"} (opțional)<input class="aa-n" value="${esc(x.nr||"")}"></label>
        ${dep?`<label title="${esc(avTerm(x).t)}">Termen legal (zile)<input class="aa-t" type="number" min="0" step="1" style="width:90px" value="${avTerm(x).z||""}"></label><span class="hint" style="flex-basis:100%">${esc(avTerm(x).t)}</span>`:""}
        <button type="button" class="btn sm primary aa-ok">Salvează</button><button type="button" class="btn sm ghost aa-no">Renunță</button>`;
      rw.after(ask);ask.querySelector(".aa-d").focus();
      ask.querySelector(".aa-no").onclick=()=>{if(x._new)av=av.filter(a=>a!==x);draw()};
      ask.querySelector(".aa-ok").onclick=()=>{const di=ask.querySelector(".aa-d"),d=di.value;
        /* data e obligatorie: din ea se calculează data obținerii conform legii */
        if(!d){di.style.borderColor="var(--crit)";di.focus();toast(dep?"Scrie data depunerii.":"Scrie data obținerii.");return}
        x.stare=st;x.nr=ask.querySelector(".aa-n").value.trim();
        if(dep){x.depusLa=d;x.obtinutLa="";const tz=ask.querySelector(".aa-t");if(tz){const v=tz.value===""?0:+tz.value;if(v!==avTermDef(x.nume).z){x.termenZile=v;x.termenTemei="termen setat manual"}else{delete x.termenZile;delete x.termenTemei}}}else{x.obtinutLa=d;const d0=ask.querySelector(".aa-d0");if(d0&&d0.value)x.depusLa=d0.value}
        delete x._new;save("„"+x.nume+"”: "+(dep?"depus în "+fmt(d):"obținut în "+fmt(d)))};
      return}
    else if(e.target.classList.contains("av-dt")){if(x.stare==="depus")x.depusLa=e.target.value;else x.obtinutLa=e.target.value;save("Data salvată")}
    else if(e.target.classList.contains("av-nr")){x.nr=e.target.value.trim();save("Număr salvat")}});
  box.addEventListener("click",e=>{const q=e.target.closest("[data-q]");const del=e.target.closest(".av-del");
    const add=(nume,src,st)=>{nume=(nume||"").trim();if(!nume)return;const ls=box.querySelector("#av-new-loc"),[loc,cu]=(ls?ls.value:"").split("||");
      if(av.some(a=>a.nume.toLowerCase()===nume.toLowerCase()&&(a.loc||"")===(loc||"")&&(a.cu||"")===(cu||""))){toast("„"+nume+"” e deja în listă");return}
      const id=newId();av.push({id,nume,sursa:isDoc(nume)?"doc":src,stare:"necesar",depusLa:"",obtinutLa:"",nr:"",...(loc?{loc}:{}),...(cu?{cu}:{})});if(st!=="necesar")av[av.length-1]._new=true;
      if(st==="necesar"){save("Adăugat: „"+nume+"”");return}
      /* depus / obținut deja: deschid direct formularul cu data și numărul */
      draw();const sel=box.querySelector(`[data-av="${id}"] .av-st`);if(sel){sel.value=st;sel.dispatchEvent(new Event("change",{bubbles:true}))}};
    if(q)add(q.dataset.q,"CU","necesar");
    else if(e.target.id==="av-add")add(box.querySelector("#av-new").value,box.querySelector("#av-new-src").value,box.querySelector("#av-new-st").value);
    else if(del){const rw=del.closest("[data-av]");const x=av.find(a=>a.id===rw.dataset.av);if(x&&confirmDel(del)){av=av.filter(a=>a!==x);save("Aviz șters: „"+x.nume+"”")}}});
  box.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.id==="av-new"){e.preventDefault();box.querySelector("#av-add").click()}});
  draw();
}

function viewAvize(){
  const mode=S.avMode||"curs";
  const ps=S.projects.filter(p=>!projClosed(p.id)&&!p.parentId).map(p=>({p,av:avOf(p.id)})).filter(x=>x.av.length).sort((a,b)=>String(a.p.nume).localeCompare(String(b.p.nume)));
  const all=ps.flatMap(x=>x.av);const c=avCount(all);
  const old=all.filter(a=>a.stare==="depus"&&avDue(a)&&avDue(a)<TODAY).length;
  let html=`<div class="row" style="justify-content:space-between;margin-bottom:10px"><div class="row" role="tablist" style="gap:4px">

  if(!ps.length)return html+`<div class="empty">Niciun aviz trecut încă. Avizele se adaugă din „Editează” → fila „Avize”, la fiecare proiect.</div>`;
  /* proiect cu mai multe locații (ex. Mega Image Sibiu): câte un bloc pe locație, titlu „Proiect – Locație” */
  const groups=ps.flatMap(({p,av})=>{const locs=[...new Set(av.map(a=>a.loc||""))];
    return locs.length>1||locs[0]?locs.sort((a,b)=>(a===""?1:0)-(b===""?1:0)).map(l=>({p,av:av.filter(a=>(a.loc||"")===l),loc:l||"general"})):[{p,av}]});

    if(loc)rows.sort((a,b)=>(mode==="curs"?(ord[a.stare]??2)-(ord[b.stare]??2):0)||String(a.nume).localeCompare(String(b.nume),"ro",{numeric:true}));
    const cus=loc?[...new Set(av.map(a=>a.cu||""))].sort((a,b)=>a.localeCompare(b,"ro",{numeric:true})):[];
    const ncol=mode==="curs"?7:5;
    const pc=avCount(av);
    const tr=a=>{const w=a.stare==="depus"&&a.depusLa?daysSince(a.depusLa):null;
      return mode==="curs"?`<tr data-act="avize" data-id="${p.id}" class="${isDoc(a.nume)?"doc":""}"><td title="${esc(a.nume)} · ${srcLbl(a)}">${esc(a.nume)}${srcLbl(a)!=="cerut prin CU"?`<span class="code">${srcLbl(a)}</span>`:""}</td><td><span class="chip ${AV_ST[a.stare][1]}">${a.stare==="depus"?"Depus · în așteptare":a.stare==="obtinut"?"Obținut "+(a.obtinutLa?fmt(a.obtinutLa):""):"De depus"}</span></td><td class="num">${a.depusLa?fmt(a.depusLa):"—"}</td><td class="num">${w==null?"—":w+" zile"}</td>${(()=>{const due=avDue(a),t=avTerm(a);
          /* coloana 1: zilele legale; coloana 2: data calculată = data depunerii + zilele legale */
          const zc=`<td class="num" title="${esc(t.t)}">${t.z?t.z+" zile":`<span class="hint">fără termen unic</span>`}</td>`;

/* fila „Lucrări finalizate” din Editează: istoricul lucrărilor predate pe proiect (13.10.2026)
   = etapele anterioare (etape[]) + lucrarea curentă, dacă e finalizată */
function lucrFin(p){
  const L=(p.etape||[]).filter(e=>e.finalizatLa).map(e=>({faza:e.faza,livrabil:e.livrabil,termen:e.termen,fin:e.finalizatLa,ore:+e.ore||0}));
  if(p.status==="finalizat"&&p.finalizatLa)L.push({faza:p.faza,livrabil:p.kind==="s"&&p.sarcina?p.livrabil+" · livrabilele mele: "+p.sarcina:p.livrabil,termen:p.termen,fin:p.finalizatLa,ore:hoursFor(p.id,p.etapaStart||""),cur:true});
  return L.sort((a,b)=>b.fin.localeCompare(a.fin));
}
function lucrFinHTML(p){
  const L=lucrFin(p);
  if(!L.length)return `<div class="empty" style="margin-top:8px">Nicio lucrare finalizată încă pe acest proiect. Când predai, alegi în „Lucrarea (faza)” starea „Lucrare finalizată / predată”; pentru o lucrare nouă pe același proiect folosești butonul „+ Livrabil nou” din bara de sus, iar cea predată rămâne aici.</div>`;
  const tot=L.reduce((a,x)=>a+x.ore,0);
  return `<div class="hint" style="margin:8px 0">Lucrările predate de tine pe acest proiect, cu orele fiecăreia. Total: <strong class="num" style="color:var(--ink)">${h(tot)} h</strong> în ${L.length} ${L.length===1?"lucrare":"lucrări"}.</div>
  <table class="avt" style="border:1px solid var(--line)"><thead><tr><th>Predat la</th><th>Fază</th><th>Livrabil</th><th>Termen</th><th>La termen</th><th style="text-align:right">Ore</th></tr></thead><tbody>${L.map(x=>{const late=x.termen&&x.fin>x.termen;
    return `<tr style="cursor:default"><td class="num">${fmt(x.fin)} ${x.fin.slice(0,4)}${x.cur?`<span class="code">lucrarea curentă</span>`:""}</td><td>${esc(x.faza||"—")}</td><td>${esc(x.livrabil||"—")}</td><td class="num">${x.termen?fmt(x.termen):"—"}</td><td>${x.termen?`<span class="chip ${late?"warn":"ok"}">${late?"după termen":"la termen"}</span>`:"—"}</td><td class="num" style="text-align:right">${h(x.ore)} h</td></tr>`}).join("")}</tbody></table>`;
}

  const other=S.logs.filter(l=>l.projectId!==pid&&l.data===day).reduce((a,l)=>a+(+l.ore||0),0);
  const tot=entries.reduce((a,l)=>a+(+l.ore||0),0);
  const nota=entries.map(l=>l.nota).filter(n=>n&&n!=="cronometru").join("; ");
  openModal(pname(pid),`<form id="dh">
    <div class="hint">Ziua: <strong style="color:var(--ink)">${fmtLong(day)}</strong></div>
    <label class="f">Ore lucrate în ziua aceasta<input type="number" id="dh-o" min="0" step="0.25" value="${tot?esc(tot):""}" placeholder="0"></label>
    <label class="f">Ce ai făcut (opțional)<input id="dh-n" value="${esc(nota)}"></label>
    <div id="dh-tot" class="hint"></div>
    <div class="hint">Lasă gol sau 0 ca să ștergi orele din ziua aceasta.</div>
    <div class="btns"><div class="r"><button type="button" class="btn ghost" data-act="close">Renunță</button><button class="btn primary" type="submit" id="dh-save">Salvează</button></div></div>
  </form>`,r=>{
    const o=r.querySelector("#dh-o"),tl=r.querySelector("#dh-tot"),sv=r.querySelector("#dh-save");o.focus();o.select();
    let confirmed=false;
    const upd=()=>{const t=other+(+o.value||0);confirmed=false;sv.textContent="Salvează";
      tl.innerHTML=t>MAX_ZI?`<span style="color:var(--crit);font-weight:600">Atenție: totalul zilei ar fi ${h(t)} h, peste limita de ${MAX_ZI} h.</span>${other?` Pe alte proiecte ai deja ${h(other)} h în ziua aceasta.`:""}`:`Total în ziua aceasta: <strong class="num" style="color:var(--ink)">${h(t)} h</strong> din ${MAX_ZI} h${other?` (${h(other)} h pe alte proiecte)`:""}`};
    o.addEventListener("input",upd);upd();
    r.querySelector("#dh").addEventListener("submit",async e=>{e.preventDefault();
      const ore=+o.value||0,n=r.querySelector("#dh-n").value.trim();
      if(other+ore>MAX_ZI&&!confirmed){confirmed=true;sv.textContent="Da, salvez peste 8 h";sv.classList.add("danger");sv.focus();toast("Ziua depășește 8 h. Verifică orele sau apasă din nou ca să confirmi.");return}
      const keepId=S.me+"__"+pid+"__"+day;
      const ok=await write(async()=>{
        for(const l of entries)if(l.id!==keepId)await hourRef(l.id).delete();
        if(ore>0)await hourRef(keepId).set({projectId:pid,personId:S.me,data:day,ore,nota:n,creatLa:new Date().toISOString()});
        else if(entries.some(l=>l.id===keepId))await hourRef(keepId).delete();
      },ore>0?h(ore)+" h salvate":"Ore șterse");
      if(ok)closeModal()});
  });
}

/* faze: lista de bază + fazele adăugate de echipă (settings/faze), editabile */
const FAZE_BASE=["CU","SF","DALI","DTAC","PAC","PT","DE","AS","Design review"];
const fazeRef=()=>col("settings").doc("faze");
const fazeAll=()=>[...FAZE_BASE,...(S.fazeCustom||[])];
function fazaOptions(cur){
  if(cur==="Altele")cur="";
  const list=fazeAll();const extra=cur&&!list.includes(cur)?[cur]:[];
  return `<option value="" ${!cur?"selected":""}>—</option>`+[...list,...extra].map(x=>`<option value="${esc(x)}" ${x===cur?"selected":""}>${esc(x)}</option>`).join("")+`<option value="__new">Altele… (scriu o fază nouă)</option>`;
}
function fazaHTML(id,cur){return `<div class="row" style="flex-wrap:nowrap;gap:4px"><select id="${id}" style="flex:1;min-width:0;text-transform:none;letter-spacing:0;font-weight:400;font-size:14px;color:var(--ink);background:var(--paper);border:1px solid var(--line);padding:6px 8px">${fazaOptions(cur||"")}</select><button type="button" class="btn sm ghost" id="${id}-ed" title="Corectează sau șterge fazele adăugate">✎</button></div><div id="${id}-panel"></div>`}
function mountFaza(r,id){
  const sel=r.querySelector("#"+id),panel=r.querySelector("#"+id+"-panel");let prev=sel.value;
  const reopts=v=>{sel.innerHTML=fazaOptions(v);sel.value=v;prev=v};
  sel.addEventListener("change",()=>{
    if(sel.value!=="__new"){prev=sel.value;panel.innerHTML="";return}
    panel.innerHTML=`<div class="fs" style="margin-top:4px"><input id="${id}-new" placeholder="Denumirea fazei noi, ex. PUZ" style="padding:6px 8px;border:1px solid var(--line);background:var(--paper)"><div class="row"><button type="button" class="btn sm primary" id="${id}-add">Adaugă în listă</button><button type="button" class="btn sm ghost" id="${id}-cancel">Renunță</button><span class="hint" id="${id}-err" style="color:var(--crit)"></span></div></div>`;
    const ni=panel.querySelector("#"+id+"-new");ni.focus();
    ni.addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();panel.querySelector("#"+id+"-add").click()}});
    panel.querySelector("#"+id+"-cancel").addEventListener("click",()=>{panel.innerHTML="";reopts(prev)});
    panel.querySelector("#"+id+"-add").addEventListener("click",async()=>{
      const n=ni.value.trim().replace(/\s+/g," "),er=panel.querySelector("#"+id+"-err");
      if(!n){er.textContent="Scrie denumirea.";return}
      const ex=fazeAll().find(x=>x.toLowerCase()===n.toLowerCase());
      if(ex){panel.innerHTML="";reopts(ex);toast("Faza „"+ex+"” exista deja în listă");return}
      const list=[...(S.fazeCustom||[]),n];
      if(await write(()=>fazeRef().set({list}),"Faza „"+n+"” a fost adăugată")){S.fazeCustom=list;panel.innerHTML="";reopts(n)}
    });
  });
  r.querySelector("#"+id+"-ed").addEventListener("click",()=>{
    if(panel.dataset.mode==="ed"){panel.innerHTML="";panel.dataset.mode="";return}
    panel.dataset.mode="ed";
    const draw=()=>{const cl=S.fazeCustom||[];
      panel.innerHTML=`<div class="fs" style="margin-top:4px;text-transform:none;letter-spacing:0;font-weight:400">${cl.length?cl.map((f,k)=>{const n=S.proj.filter(p=>p.faza===f).length;return `<div style="display:flex;flex-direction:column;gap:4px;padding-bottom:6px;border-bottom:1px dashed var(--line-2)"><input data-fz="${k}" value="${esc(f)}" aria-label="Denumirea fazei" style="width:100%;padding:5px 8px;border:1px solid var(--line);background:var(--paper);font-size:14px;color:var(--ink)"><div class="row" style="gap:6px"><button type="button" class="btn sm" data-fzsave="${k}">Corectează</button><button type="button" class="btn sm danger" data-fzdel="${k}">Șterge</button><span class="hint">folosită la ${n} ${n===1?"proiect":"proiecte"}</span></div></div>`}).join(""):`<span class="hint">Nu ai adăugat încă faze proprii. Fazele de bază (CU, SF, DALI, DTAC, PAC, PT, DE, AS, Design review) nu se modifică.</span>`}</div>`;
      panel.querySelectorAll("[data-fzsave]").forEach(b=>b.addEventListener("click",async()=>{
        const k=+b.dataset.fzsave,old=cl[k],nv=panel.querySelector(`[data-fz="${k}"]`).value.trim().replace(/\s+/g," ");
        if(!nv||nv===old)return;
        if(fazeAll().some(x=>x!==old&&x.toLowerCase()===nv.toLowerCase())){toast("Există deja o fază cu acest nume.");return}
        const list=cl.map(x=>x===old?nv:x);
        if(await write(async()=>{await fazeRef().set({list});for(const p of S.proj.filter(p=>p.faza===old))await projRef(p.id).update({faza:nv})},"Corectat: „"+old+"” → „"+nv+"”")){S.fazeCustom=list;reopts(sel.value===old?nv:sel.value);draw()}
      }));
      panel.querySelectorAll("[data-fzdel]").forEach(b=>b.addEventListener("click",async()=>{
        const k=+b.dataset.fzdel,old=cl[k],n=S.proj.filter(p=>p.faza===old).length;
        if(b.dataset.sure!=="1"){b.dataset.sure="1";b.textContent=n?`Sigur? (${n} proiecte rămân fără fază)`:"Sigur?";return}
        const list=cl.filter(x=>x!==old);
        if(await write(async()=>{await fazeRef().set({list});for(const p of S.proj.filter(p=>p.faza===old))await projRef(p.id).update({faza:""})},"Faza „"+old+"” a fost ștearsă")){S.fazeCustom=list;reopts(sel.value===old?"":sel.value);draw()}
      }));
    };
    draw();
  });
}

/* zilele de lucru nu pot depăși termenul de predare */
function bindDeadline(r,sel){
  const t=r.querySelector(sel);if(!t)return;
  const msg=document.createElement("div");msg.className="hint";msg.style.color="var(--crit)";msg.hidden=true;
  const daysBox=r.querySelector("#pf-days,#ef-days");if(daysBox)daysBox.after(msg);
  const apply=()=>{const tl=t.value;let dropped=0;
    (daysBox?daysBox.querySelectorAll("label"):[]).forEach(l=>{const i=l.querySelector("input");const off=!!tl&&i.value>tl;
      if(off&&i.checked){i.checked=false;dropped++}
      i.disabled=off;l.classList.toggle("off",off);l.title=off?"După termenul de predare":""});
    msg.hidden=!dropped;msg.textContent=dropped?`Am debifat ${dropped} ${dropped===1?"zi":"zile"} de după termen (${fmt(tl)}).`:""};
  t.addEventListener("change",apply);t.addEventListener("input",apply);apply();
}

    <div class="f" style="font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-2);font-weight:600">Zile în care lucrez la el
      <div class="days" id="ef-days" style="margin-top:6px">${days.map(d=>`<label><input type="checkbox" value="${d}" ${d===TODAY?"checked":""}>${ZI[parse(d).getDay()]} ${parse(d).getDate()}</label>`).join("")}</div></div>
